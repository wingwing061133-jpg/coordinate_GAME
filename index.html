<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑板直角坐標五子棋 - 第一象限預設彈性版</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --card-bg: #111827;
            --accent-yellow: #fbbf24;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --board-green: #0d2818;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #0b0f19 0%, #1e1b4b 100%);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .app-header {
            text-align: center;
            margin-bottom: 10px;
        }
        h1 {
            margin: 0;
            color: var(--accent-yellow);
            font-size: 1.5rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .subtitle {
            font-size: 0.8rem;
            color: var(--accent-yellow);
            margin-top: 3px;
            opacity: 0.9;
        }

        .top-nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            padding: 10px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            max-width: 800px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .select-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .select-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #cbd5e1;
        }
        select.custom-select {
            background: #1f2937;
            border: 1px solid #374151;
            color: #f8fafc;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }
        select.custom-select:hover {
            border-color: var(--accent-yellow);
        }
        select.custom-select:focus {
            border-color: var(--accent-yellow);
            box-shadow: 0 0 8px rgba(251, 191, 36, 0.3);
        }
        .timer-badge {
            background: #0284c7;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid #38bdf8;
            cursor: pointer;
            user-select: none;
        }

        .main-layout {
            display: flex;
            gap: 14px;
            max-width: 800px;
            width: 100%;
            box-sizing: border-box;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .control-card {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px;
            width: 250px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .status-box {
            background: #0b0f19;
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            border: 1px solid #1f2937;
        }
        .turn-text { font-size: 0.95rem; font-weight: 700; color: #f8fafc; }

        .stats-row { display: flex; gap: 8px; }
        .stat-badge {
            flex: 1;
            background: #0b0f19;
            border: 1px solid #1f2937;
            border-radius: 8px;
            padding: 6px;
            text-align: center;
        }
        .stat-label { font-size: 0.65rem; color: var(--text-muted); }
        .stat-value { font-size: 1.1rem; font-weight: 800; color: var(--accent-yellow); }

        .btn-action {
            width: 100%;
            padding: 7px;
            font-size: 0.8rem;
            font-weight: 700;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #1f2937;
            color: #f8fafc;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-action:hover { background: #374151; }

        .input-section {
            background: #0b0f19;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 10px;
        }
        .input-title { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
        .coordinate-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .coord-box {
            width: 36px;
            height: 30px;
            background: #111827;
            border: 2px solid #374151;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-yellow);
            cursor: pointer;
        }
        .coord-box.active { border-color: var(--accent-yellow); box-shadow: 0 0 8px rgba(251, 191, 36, 0.3); }

        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-bottom: 8px;
        }
        .key-btn {
            background: #1f2937;
            border: 1px solid #374151;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 700;
            height: 30px;
            border-radius: 6px;
            cursor: pointer;
        }
        .key-btn:hover { background: #374151; }
        .key-btn.btn-clear { background: #991b1b; border-color: #b91c1c; }

        .btn-confirm {
            width: 100%;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            border: 1px solid #10b981;
            color: white;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 7px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .feedback-msg {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--accent-yellow);
            text-align: center;
            min-height: 16px;
        }

        .board-card {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            position: relative;
        }
        canvas {
            border: 2px solid #374151;
            background-color: var(--board-green);
            border-radius: 10px;
            cursor: crosshair;
        }
        .board-tip { font-size: 0.75rem; color: var(--accent-yellow); margin-top: 8px; text-align: center; font-weight: 700; }

        .win-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.88);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
            z-index: 20;
        }
        .win-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .win-box {
            background: linear-gradient(135deg, #1e1b4b 0%, #111827 100%);
            border: 2px solid var(--accent-yellow);
            border-radius: 20px;
            padding: 24px 36px;
            text-align: center;
            box-shadow: 0 0 40px rgba(251, 191, 36, 0.4);
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .win-overlay.show .win-box {
            transform: scale(1);
        }
        .win-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--accent-yellow);
            margin: 0 0 8px 0;
            text-shadow: 0 0 12px rgba(251, 191, 36, 0.5);
        }
        .win-title.lose {
            color: #ef4444;
            text-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
        }
        .win-sub {
            font-size: 1.1rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 8px;
        }
        .win-time-tag {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid #38bdf8;
            color: #38bdf8;
            font-size: 1rem;
            font-weight: 800;
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .btn-restart-win {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            color: #0b0f19;
            font-size: 0.95rem;
            font-weight: 800;
            padding: 10px 24px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4);
            transition: transform 0.2s;
        }
        .btn-restart-win:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="app-header">
        <h1>🎮 直角坐標五子棋</h1>
        <div class="subtitle">先橫軸 (X) 後縱軸 (Y)，率先五子連線獲勝！</div>
    </div>

    <!-- 頂部控制膠囊列：預設第一象限，但可自由下拉選擇 -->
    <div class="top-nav-bar">
        <div class="select-group">
            <div class="select-item">
                <span>📍 象限：</span>
                <select class="custom-select" id="quadrantSelect" onchange="onQuadrantChange(this.value)">
                    <option value="q1" selected>第一象限 Q1 (預設)</option>
                    <option value="full">全象限 Full</option>
                    <option value="q2">第二象限 Q2</option>
                    <option value="q3">第三象限 Q3</option>
                    <option value="q4">第四象限 Q4</option>
                </select>
            </div>
            <div class="select-item">
                <span>📐 棋盤：</span>
                <select class="custom-select" id="sizeSelect" onchange="onSizeChange(this.value)">
                    <option value="8" selected>8 x 8</option>
                    <option value="10">10 x 10</option>
                    <option value="12">12 x 12</option>
                    <option value="16">16 x 16</option>
                </select>
            </div>
            <div class="select-item">
                <span>🎮 模式：</span>
                <select class="custom-select" id="modeSelect" onchange="onModeChange(this.value)">
                    <option value="pvp" selected>👥 雙人對戰</option>
                    <option value="pve">🤖 單人 AI</option>
                </select>
            </div>
        </div>
        <div class="timer-badge" id="timerDisplay" onclick="toggleTimer()" title="點擊暫停/繼續計時">⏱️ 00:00</div>
    </div>

    <div class="main-layout">
        <!-- 左側控制面板 -->
        <div class="control-card">
            <div class="status-box">
                <div class="stat-label">當前回合 Turn</div>
                <div class="turn-text" id="turnDisplay">⚫ 黑方落子</div>
            </div>

            <div class="stats-row">
                <div class="stat-badge">
                    <div class="stat-label">黑棋總數</div>
                    <div class="stat-value" id="blackCount">0</div>
                </div>
                <div class="stat-badge">
                    <div class="stat-label">白棋總數</div>
                    <div class="stat-value" id="whiteCount">0</div>
                </div>
            </div>

            <button class="btn-action" onclick="undoMove()">↩ 復原 (Undo)</button>
            <button class="btn-action" onclick="resetGame()">🔄 重新開始</button>

            <div class="input-section">
                <div class="input-title">座標落子 (Coordinate Input)</div>
                <div class="coordinate-display">
                    <span>P(</span>
                    <span class="coord-box active" id="boxX" onclick="setActiveAxis('x')"></span>
                    <span>,</span>
                    <span class="coord-box" id="boxY" onclick="setActiveAxis('y')"></span>
                    <span>)</span>
                </div>
                <div class="keypad">
                    <button class="key-btn" onclick="appendKey('-')">-</button>
                    <button class="key-btn" onclick="appendKey('1')">1</button>
                    <button class="key-btn" onclick="appendKey('2')">2</button>
                    <button class="key-btn" onclick="appendKey('3')">3</button>
                    <button class="key-btn" onclick="appendKey('4')">4</button>
                    <button class="key-btn" onclick="appendKey('5')">5</button>
                    <button class="key-btn" onclick="appendKey('6')">6</button>
                    <button class="key-btn" onclick="appendKey('7')">7</button>
                    <button class="key-btn" onclick="appendKey('8')">8</button>
                    <button class="key-btn" onclick="appendKey('9')">9</button>
                    <button class="key-btn" onclick="appendKey('0')">0</button>
                    <button class="key-btn btn-clear" onclick="clearKey()">C</button>
                </div>
                <button class="btn-confirm" onclick="placePieceByInput()">🎯 確認落子 (Place Piece)</button>
            </div>

            <div class="feedback-msg" id="feedbackMsg">點擊棋盤網格點或輸入坐標落子！</div>
        </div>

        <!-- 右側畫布卡片與 WIN/LOSE 畫面 -->
        <div class="board-card">
            <canvas id="gameCanvas" width="460" height="460"></canvas>
            <div class="board-tip" id="boardTipText">第一象限 (X 軸向右、Y 軸向上，原點為 0)</div>

            <!-- WIN / LOSE 勝利與失敗彈窗畫面 -->
            <div class="win-overlay" id="winOverlay">
                <div class="win-box">
                    <div class="win-title" id="winTitleText">🎉 你 WIN 了！</div>
                    <div class="win-sub" id="winSubText">恭喜黑方率先完成五子連線！</div>
                    <div class="win-time-tag" id="winTimeTag">⏱️ 通關用時：00分00秒</div>
                    <div>
                        <button class="btn-restart-win" onclick="resetGame()">再玩一局 🔄</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const canvasSize = 460;

        let currentQuadrant = 'q1'; // 預設為第一象限
        let boardSize = 8;
        let gameMode = 'pvp';
        let boardState = {}; 
        let moveHistory = [];
        let currentTurn = 'B';
        let isGameOver = false;

        let inputX = "";
        let inputY = "";
        let activeAxis = 'x';

        let secondsElapsed = 0;
        let isTimerRunning = true;
        let timerInterval = setInterval(() => {
            if (!isGameOver && isTimerRunning) {
                secondsElapsed++;
                let m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                let s = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('timerDisplay').innerText = `⏱️ ${m}:${s}`;
            }
        }, 1000);

        function toggleTimer() {
            isTimerRunning = !isTimerRunning;
        }

        function playSound(type) {
            try {
                const ac = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ac.createOscillator();
                const gain = ac.createGain();
                osc.connect(gain); gain.connect(ac.destination);

                if (type === 'click') {
                    osc.frequency.setValueAtTime(500, ac.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(150, ac.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.25, ac.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ac.currentTime + 0.08);
                    osc.start(); osc.stop(ac.currentTime + 0.08);
                } else if (type === 'win') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                        let o = ac.createOscillator(), g = ac.createGain();
                        o.connect(g); g.connect(ac.destination);
                        o.type = 'triangle';
                        o.frequency.setValueAtTime(f, ac.currentTime + i * 0.1);
                        g.gain.setValueAtTime(0.2, ac.currentTime + i * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + i * 0.1 + 0.35);
                        o.start(ac.currentTime + i * 0.1); o.stop(ac.currentTime + i * 0.1 + 0.35);
                    });
                } else if (type === 'lose') {
                    [440, 370, 311, 220].forEach((f, i) => {
                        let o = ac.createOscillator(), g = ac.createGain();
                        o.connect(g); g.connect(ac.destination);
                        o.type = 'sawtooth';
                        o.frequency.setValueAtTime(f, ac.currentTime + i * 0.12);
                        g.gain.setValueAtTime(0.2, ac.currentTime + i * 0.12);
                        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + i * 0.12 + 0.4);
                        o.start(ac.currentTime + i * 0.12); o.stop(ac.currentTime + i * 0.12 + 0.4);
                    });
                }
            } catch(e) {}
        }

        function onQuadrantChange(val) { 
            currentQuadrant = val; 
            let tip = "直角坐標五子棋";
            if(val === 'q1') tip = "第一象限 (X 軸向右、Y 軸向上，原點為 0)";
            else if(val === 'full') tip = "全象限模式 (四個象限與負數坐標)";
            else tip = `${val.toUpperCase()} 象限模式`;
            document.getElementById('boardTipText').innerText = tip;
            resetGame(); 
        }
        function onSizeChange(val) { boardSize = parseInt(val); resetGame(); }
        function onModeChange(val) { gameMode = val; resetGame(); }

        function setActiveAxis(axis) {
            activeAxis = axis;
            document.getElementById('boxX').classList.toggle('active', axis === 'x');
            document.getElementById('boxY').classList.toggle('active', axis === 'y');
        }

        function appendKey(val) {
            if (activeAxis === 'x') {
                if (val === '-' && inputX.includes('-')) return;
                inputX += val;
                document.getElementById('boxX').innerText = inputX;
            } else {
                if (val === '-' && inputY.includes('-')) return;
                inputY += val;
                document.getElementById('boxY').innerText = inputY;
            }
        }

        function clearKey() {
            if (activeAxis === 'x') { inputX = ""; document.getElementById('boxX').innerText = ""; }
            else { inputY = ""; document.getElementById('boxY').innerText = ""; }
        }

        function resetGame() {
            boardState = {};
            moveHistory = [];
            currentTurn = 'B';
            isGameOver = false;
            secondsElapsed = 0;
            inputX = ""; inputY = "";
            document.getElementById('boxX').innerText = "";
            document.getElementById('boxY').innerText = "";
            document.getElementById('turnDisplay').innerText = "⚫ 黑方落子";
            document.getElementById('feedbackMsg').innerText = "新局開始！請落子。";
            document.getElementById('timerDisplay').innerText = `⏱️ 00:00`;
            document.getElementById('winOverlay').classList.remove('show');
            updateCounts();
            drawBoard();
        }

        function updateCounts() {
            let b = 0, w = 0;
            for (let k in boardState) {
                if (boardState[k] === 'B') b++; else w++;
            }
            document.getElementById('blackCount').innerText = b;
            document.getElementById('whiteCount').innerText = w;
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvasSize, canvasSize);
            ctx.fillStyle = '#0d2818';
            ctx.fillRect(0, 0, canvasSize, canvasSize);

            let pad = 50;
            let usable = canvasSize - pad * 2;
            let originX, originY, scale;

            if (currentQuadrant === 'full') {
                originX = canvasSize / 2;
                originY = canvasSize / 2;
                scale = usable / (boardSize * 2);

                ctx.strokeStyle = '#14532d'; ctx.lineWidth = 1;
                for (let i = -boardSize; i <= boardSize; i++) {
                    let px = originX + i * scale;
                    let py = originY + i * scale;
                    ctx.beginPath(); ctx.moveTo(px, originY - boardSize * scale); ctx.lineTo(px, originY + boardSize * scale); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(originX - boardSize * scale, py); ctx.lineTo(originX + boardSize * scale, py); ctx.stroke();
                }

                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(originX - (boardSize + 0.8) * scale, originY); ctx.lineTo(originX + (boardSize + 0.8) * scale, originY);
                ctx.moveTo(originX, originY - (boardSize + 0.8) * scale); ctx.lineTo(originX, originY + (boardSize + 0.8) * scale);
                ctx.stroke();

                ctx.fillStyle = '#ffffff'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                for (let i = -boardSize; i <= boardSize; i++) {
                    if (i !== 0) {
                        ctx.fillText(i, originX + i * scale, originY + 14);
                        ctx.fillText(i, originX - 16, originY - i * scale);
                    }
                }
                ctx.fillText('0', originX - 10, originY + 12);
                ctx.fillText('X', originX + (boardSize + 0.8) * scale, originY - 14);
                ctx.fillText('Y', originX + 16, originY - (boardSize + 0.8) * scale);

            } else {
                scale = usable / boardSize;
                if (currentQuadrant === 'q1') {
                    originX = pad; originY = canvasSize - pad;
                    for (let i = 0; i <= boardSize; i++) {
                        let px = originX + i * scale, py = originY - i * scale;
                        ctx.strokeStyle = '#14532d'; ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.moveTo(px, originY - boardSize * scale); ctx.lineTo(px, originY); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(originX, py); ctx.lineTo(originX + boardSize * scale, py); ctx.stroke();
                    }
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(originX - 8, originY); ctx.lineTo(originX + (boardSize + 0.5) * scale, originY);
                    ctx.moveTo(originX, originY + 8); ctx.lineTo(originX, originY - (boardSize + 0.5) * scale);
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    for (let i = 1; i <= boardSize; i++) {
                        ctx.fillText(i, originX + i * scale, originY + 16);
                        ctx.fillText(i, originX - 18, originY - i * scale);
                    }
                    ctx.fillText('0', originX - 12, originY + 14);
                    ctx.fillText('X', originX + (boardSize + 0.4) * scale, originY + 22);
                    ctx.fillText('Y', originX, originY - (boardSize + 0.6) * scale);
                } else if (currentQuadrant === 'q2') {
                    originX = canvasSize - pad; originY = canvasSize - pad;
                    for (let i = 0; i <= boardSize; i++) {
                        let px = originX - i * scale, py = originY - i * scale;
                        ctx.strokeStyle = '#14532d'; ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.moveTo(px, originY - boardSize * scale); ctx.lineTo(px, originY); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(originX, py); ctx.lineTo(originX - boardSize * scale, py); ctx.stroke();
                    }
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(originX + 8, originY); ctx.lineTo(originX - (boardSize + 0.5) * scale, originY);
                    ctx.moveTo(originX, originY + 8); ctx.lineTo(originX, originY - (boardSize + 0.5) * scale);
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    for (let i = 1; i <= boardSize; i++) {
                        ctx.fillText(-i, originX - i * scale, originY + 14);
                        ctx.fillText(i, originX + 16, originY - i * scale);
                    }
                    ctx.fillText('0', originX + 10, originY + 12);
                    ctx.fillText('X', originX - boardSize * scale, originY + 22);
                    ctx.fillText('Y', originX, originY - boardSize * scale);
                } else if (currentQuadrant === 'q3') {
                    originX = canvasSize - pad; originY = pad;
                    for (let i = 0; i <= boardSize; i++) {
                        let px = originX - i * scale, py = originY + i * scale;
                        ctx.strokeStyle = '#14532d'; ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.moveTo(px, originY + boardSize * scale); ctx.lineTo(px, originY); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(originX, py); ctx.lineTo(originX - boardSize * scale, py); ctx.stroke();
                    }
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(originX + 8, originY); ctx.lineTo(originX - (boardSize + 0.5) * scale, originY);
                    ctx.moveTo(originX, originY - 8); ctx.lineTo(originX, originY + (boardSize + 0.5) * scale);
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    for (let i = 1; i <= boardSize; i++) {
                        ctx.fillText(-i, originX - i * scale, originY - 14);
                        ctx.fillText(-i, originX + 16, originY + i * scale);
                    }
                    ctx.fillText('0', originX + 10, originY - 12);
                    ctx.fillText('X', originX - boardSize * scale, originY - 22);
                    ctx.fillText('Y', originX, originY + boardSize * scale);
                } else if (currentQuadrant === 'q4') {
                    originX = pad; originY = pad;
                    for (let i = 0; i <= boardSize; i++) {
                        let px = originX + i * scale, py = originY + i * scale;
                        ctx.strokeStyle = '#14532d'; ctx.lineWidth = 1;
                        ctx.beginPath(); ctx.moveTo(px, originY + boardSize * scale); ctx.lineTo(px, originY); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(originX, py); ctx.lineTo(originX + boardSize * scale, py); ctx.stroke();
                    }
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(originX - 8, originY); ctx.lineTo(originX + (boardSize + 0.5) * scale, originY);
                    ctx.moveTo(originX, originY - 8); ctx.lineTo(originX, originY + (boardSize + 0.5) * scale);
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    for (let i = 1; i <= boardSize; i++) {
                        ctx.fillText(i, originX + i * scale, originY - 14);
                        ctx.fillText(-i, originX - 16, originY + i * scale);
                    }
                    ctx.fillText('0', originX - 10, originY - 12);
                    ctx.fillText('X', originX + boardSize * scale, originY - 22);
                    ctx.fillText('Y', originX, originY + boardSize * scale);
                }
            }

            // 畫純色棋子
            for (let key in boardState) {
                let parts = key.split(',');
                let x = parseInt(parts[0]), y = parseInt(parts[1]);
                let sx, sy;

                if (currentQuadrant === 'full') {
                    sx = originX + x * scale;
                    sy = originY - y * scale;
                } else if (currentQuadrant === 'q1') {
                    sx = originX + x * scale; sy = originY - y * scale;
                } else if (currentQuadrant === 'q2') {
                    sx = originX - Math.abs(x) * scale; sy = originY - y * scale;
                } else if (currentQuadrant === 'q3') {
                    sx = originX - Math.abs(x) * scale; sy = originY + Math.abs(y) * scale;
                } else if (currentQuadrant === 'q4') {
                    sx = originX + x * scale; sy = originY + Math.abs(y) * scale;
                }

                ctx.fillStyle = (boardState[key] === 'B') ? '#000000' : '#ffffff';
                ctx.beginPath(); ctx.arc(sx, sy, Math.max(7, scale * 0.4), 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = (boardState[key] === 'B') ? '#38bdf8' : '#0284c7';
                ctx.lineWidth = 2; ctx.stroke();
            }
        }

        canvas.addEventListener('click', (e) => {
            if (isGameOver || (gameMode === 'pve' && currentTurn === 'W')) return;
            let rect = canvas.getBoundingClientRect();
            let xPx = e.clientX - rect.left;
            let yPx = e.clientY - rect.top;

            let pad = 50;
            let usable = canvasSize - pad * 2;
            let originX, originY, scale;

            if (currentQuadrant === 'full') {
                originX = canvasSize / 2; originY = canvasSize / 2;
                scale = usable / (boardSize * 2);
                let rx = Math.round((xPx - originX) / scale);
                let ry = Math.round((originY - yPx) / scale);
                if (rx >= -boardSize && rx <= boardSize && ry >= -boardSize && ry <= boardSize) {
                    makeMove(rx, ry);
                }
            } else {
                scale = usable / boardSize;
                if (currentQuadrant === 'q1') {
                    originX = pad; originY = canvasSize - pad;
                    let rx = Math.round((xPx - originX) / scale);
                    let ry = Math.round((originY - yPx) / scale);
                    if (rx >= 0 && rx <= boardSize && ry >= 0 && ry <= boardSize) makeMove(rx, ry);
                } else if (currentQuadrant === 'q2') {
                    originX = canvasSize - pad; originY = canvasSize - pad;
                    let rx = -Math.round((originX - xPx) / scale);
                    let ry = Math.round((originY - yPx) / scale);
                    if (rx >= -boardSize && rx <= 0 && ry >= 0 && ry <= boardSize) makeMove(rx, ry);
                } else if (currentQuadrant === 'q3') {
                    originX = canvasSize - pad; originY = pad;
                    let rx = -Math.round((originX - xPx) / scale);
                    let ry = -Math.round((yPx - originY) / scale);
                    if (rx >= -boardSize && rx <= 0 && ry >= -boardSize && ry <= 0) makeMove(rx, ry);
                } else if (currentQuadrant === 'q4') {
                    originX = pad; originY = pad;
                    let rx = Math.round((xPx - originX) / scale);
                    let ry = -Math.round((yPx - originY) / scale);
                    if (rx >= 0 && rx <= boardSize && ry >= -boardSize && ry <= 0) makeMove(rx, ry);
                }
            }
        });

        function placePieceByInput() {
            if (isGameOver || (gameMode === 'pve' && currentTurn === 'W')) return;
            let x = parseInt(inputX);
            let y = parseInt(inputY);
            if (isNaN(x) || isNaN(y)) {
                document.getElementById('feedbackMsg').innerText = "請完整輸入 X 和 Y 座標！";
                return;
            }
            makeMove(x, y);
        }

        function makeMove(x, y) {
            let key = `${x},${y}`;
            if (boardState[key]) {
                document.getElementById('feedbackMsg').innerText = "呢個位置已經有棋子啦！";
                return;
            }

            let valid = false;
            if (currentQuadrant === 'full') {
                if (x >= -boardSize && x <= boardSize && y >= -boardSize && y <= boardSize) valid = true;
            } else if (currentQuadrant === 'q1') {
                if (x >= 0 && x <= boardSize && y >= 0 && y <= boardSize) valid = true;
            } else if (currentQuadrant === 'q2') {
                if (x >= -boardSize && x <= 0 && y >= 0 && y <= boardSize) valid = true;
            } else if (currentQuadrant === 'q3') {
                if (x >= -boardSize && x <= 0 && y >= -boardSize && y <= 0) valid = true;
            } else if (currentQuadrant === 'q4') {
                if (x >= 0 && x <= boardSize && y >= -boardSize && y <= 0) valid = true;
            }

            if (!valid) {
                document.getElementById('feedbackMsg').innerText = "坐標超出目前象限棋盤範圍！";
                return;
            }

            boardState[key] = currentTurn;
            moveHistory.push({x, y, player: currentTurn});
            playSound('click');
            updateCounts();
            drawBoard();

            if (checkWin(x, y, currentTurn)) {
                isGameOver = true;
                let m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                let s = String(secondsElapsed % 60).padStart(2, '0');
                let timeStr = `${m}分${s}秒`;

                if (gameMode === 'pve' && currentTurn === 'W') {
                    playSound('lose');
                    document.getElementById('turnDisplay').innerText = "🏆 遊戲結束 (AI 獲勝)";
                    document.getElementById('feedbackMsg').innerText = `😢 AI 率先五子連線獲勝！`;
                    
                    document.getElementById('winTitleText').innerText = "💥 你 LOSE 了！";
                    document.getElementById('winTitleText').classList.add('lose');
                    document.getElementById('winSubText').innerText = `AI 率先完成五子連線，再接再厲！`;
                    document.getElementById('winTimeTag').innerText = `⏱️ 耗費時間：${timeStr}`;
                } else {
                    playSound('win');
                    document.getElementById('turnDisplay').innerText = "🏆 遊戲結束";
                    document.getElementById('feedbackMsg').innerText = `🎊 恭喜率先獲勝！用時：${timeStr}`;
                    
                    document.getElementById('winTitleText').innerText = "🎉 你 WIN 了！";
                    document.getElementById('winTitleText').classList.remove('lose');
                    document.getElementById('winSubText').innerText = `恭喜率先完成五子連線！`;
                    document.getElementById('winTimeTag').innerText = `⏱️ 通關用時：${timeStr}`;
                }

                document.getElementById('winOverlay').classList.add('show');
                return;
            }

            currentTurn = (currentTurn === 'B') ? 'W' : 'B';
            document.getElementById('turnDisplay').innerText = (currentTurn === 'B') ? '⚫ 黑方落子' : '⚪ 白方落子';
            document.getElementById('feedbackMsg').innerText = `落子成功 (${x}, ${y})`;
            inputX = ""; inputY = "";
            document.getElementById('boxX').innerText = "";
            document.getElementById('boxY').innerText = "";

            if (gameMode === 'pve' && currentTurn === 'W' && !isGameOver) {
                document.getElementById('feedbackMsg').innerText = "🤖 AI 思考中...";
                setTimeout(makeAIMove, 400);
            }
        }

        function undoMove() {
            if (moveHistory.length === 0 || isGameOver) return;
            let last = moveHistory.pop();
            delete boardState[`${last.x},${last.y}`];
            if (gameMode === 'pve' && moveHistory.length > 0) {
                let lastAI = moveHistory.pop();
                delete boardState[`${lastAI.x},${lastAI.y}`];
            }
            currentTurn = 'B';
            isGameOver = false;
            document.getElementById('winOverlay').classList.remove('show');
            document.getElementById('turnDisplay').innerText = '⚫ 黑方落子';
            document.getElementById('feedbackMsg').innerText = '已復原上一步';
            updateCounts();
            drawBoard();
        }

        function makeAIMove() {
            if (isGameOver) return;
            let bestMove = null;
            let maxScore = -Infinity;
            
            let start = (currentQuadrant === 'full') ? -boardSize : 0;
            let end = (currentQuadrant === 'full') ? boardSize : boardSize;

            for (let x = start; x <= end; x++) {
                for (let y = start; y <= end; y++) {
                    let key = `${x},${y}`;
                    if (isInRange(x, y) && !boardState[key]) {
                        let attackScore = evaluatePoint(x, y, 'W');
                        let defenseScore = evaluatePoint(x, y, 'B');
                        let totalScore = attackScore * 1.2 + defenseScore * 1.0;
                        totalScore += getProximityBonus(x, y);

                        if (totalScore > maxScore) {
                            maxScore = totalScore;
                            bestMove = {x, y};
                        }
                    }
                }
            }

            if (bestMove) {
                makeMove(bestMove.x, bestMove.y);
            }
        }

        function evaluatePoint(x, y, player) {
            let totalValue = 0;
            let dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];

            for (let [dx, dy] of dirs) {
                let count = 1;
                let openEnds = 0;

                let cx = x + dx, cy = y + dy;
                while (boardState[`${cx},${cy}`] === player) {
                    count++;
                    cx += dx; cy += dy;
                }
                if (isInRange(cx, cy) && !boardState[`${cx},${cy}`]) openEnds++;

                cx = x - dx; cy = y - dy;
                while (boardState[`${cx},${cy}`] === player) {
                    count++;
                    cx -= dx; cy -= dy;
                }
                if (isInRange(cx, cy) && !boardState[`${cx},${cy}`]) openEnds++;

                if (count >= 5) totalValue += 1000000;
                else if (count === 4 && openEnds === 2) totalValue += 100000;
                else if (count === 4 && openEnds === 1) totalValue += 10000;
                else if (count === 3 && openEnds === 2) totalValue += 8000;
                else if (count === 3 && openEnds === 1) totalValue += 1000;
                else if (count === 2 && openEnds === 2) totalValue += 500;
                else if (count === 2 && openEnds === 1) totalValue += 100;
            }
            return totalValue;
        }

        function getProximityBonus(x, y) {
            let bonus = 0;
            for (let key in boardState) {
                let [px, py] = key.split(',').map(Number);
                let dist = Math.abs(x - px) + Math.abs(y - py);
                if (dist <= 2) bonus += (3 - dist);
            }
            return bonus;
        }

        function isInRange(x, y) {
            if (currentQuadrant === 'full') return x >= -boardSize && x <= boardSize && y >= -boardSize && y <= boardSize;
            if (currentQuadrant === 'q1') return x >= 0 && x <= boardSize && y >= 0 && y <= boardSize;
            if (currentQuadrant === 'q2') return x >= -boardSize && x <= 0 && y >= 0 && y <= boardSize;
            if (currentQuadrant === 'q3') return x >= -boardSize && x <= 0 && y >= -boardSize && y <= 0;
            if (currentQuadrant === 'q4') return x >= 0 && x <= boardSize && y >= -boardSize && y <= 0;
            return false;
        }

        function checkWin(lastX, lastY, player) {
            let dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
            for (let [dx, dy] of dirs) {
                let count = 1;
                let cx = lastX + dx, cy = lastY + dy;
                while (boardState[`${cx},${cy}`] === player) { count++; cx += dx; cy += dy; }
                cx = lastX - dx; cy = lastY - dy;
                while (boardState[`${cx},${cy}`] === player) { count++; cx -= dx; cy -= dy; }
                if (count >= 5) return true;
            }
            return false;
        }

        drawBoard();
    </script>
